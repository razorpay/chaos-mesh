name: Website Deployment

on:
  push:
    branches:
    - master
    paths:
    - "website/**"

jobs:
  deploy-website:
    name: Deplpy website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e  # v1
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1
        with:
          node-version: '12.x'
      - name: Cache/restore dependencies
        uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7  # v1
        id: cache
        with:
          path: ./website/node_modules
          key: website-${{ hashFiles('website/yarn.lock') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --cwd ./website
      - name: Add key to allow access to repository
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "${{ secrets.GH_PAGES_DEPLOY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat <<EOT >> ~/.ssh/config
          Host github.com
          HostName github.com
          IdentityFile ~/.ssh/id_rsa
          EOT
      - name: Release to GitHub Pages
        working-directory: ./website
        env:
          USE_SSH: true
          GIT_USER: git
          NAME: ${{ secrets.GH_PAGES_DEPLOY_NAME }}
          EMAIL: ${{ secrets.GH_PAGES_DEPLOY_EMAIL }}
        run: |
          git config --global user.email "$EMAIL"
          git config --global user.name "$NAME"
          yarn deploy
